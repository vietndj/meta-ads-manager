<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Ads Dashboard - Fedu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .bg-slate { background-color: #0f172a; }
        .text-slate-secondary { color: #64748b; }
        .zebra-row:nth-child(even) { background-color: #f8fafc; }
        .zebra-row:nth-child(odd) { background-color: #ffffff; }
    </style>
</head>
<body class="p-4 md:p-8">
    <header class="mb-8">
        <h1 class="text-3xl font-bold bg-slate text-white p-4 rounded-lg shadow">Marketing Dashboard</h1>
    </header>

    <div id="kpi-cards" class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
        <!-- KPI Cards will be injected here -->
    </div>

    <div class="bg-white p-4 rounded-lg shadow mb-8">
        <h2 class="text-xl font-bold mb-4">Chi phí theo ngày</h2>
        <canvas id="spendChart" height="100"></canvas>
    </div>

    <div class="bg-white p-4 rounded-lg shadow mb-8" id="marketing-insights">
        <!-- Insights injected here -->
    </div>

    <div class="bg-white p-4 rounded-lg shadow overflow-x-auto">
        <h2 class="text-xl font-bold mb-4">Chi tiết Chiến dịch</h2>
        <div class="flex gap-4 mb-4">
            <input type="text" id="searchInput" placeholder="Tìm kiếm chiến dịch..." class="border p-2 rounded">
        </div>
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="bg-slate text-white">
                    <th class="p-2 cursor-pointer" onclick="sortTable(0)">Tên Chiến Dịch</th>
                    <th class="p-2">Tài khoản</th>
                    <th class="p-2 cursor-pointer" onclick="sortTable(2)">Spend</th>
                    <th class="p-2">Impressions</th>
                    <th class="p-2">Clicks</th>
                    <th class="p-2">CTR</th>
                    <th class="p-2 cursor-pointer" onclick="sortTable(6)">Conversions</th>
                    <th class="p-2 cursor-pointer" onclick="sortTable(7)">CPA</th>
                    <th class="p-2">Trạng thái</th>
                </tr>
            </thead>
            <tbody id="campaign-table">
                <!-- Data injected here -->
            </tbody>
        </table>
    </div>

    <footer class="mt-8 text-center text-slate-secondary text-sm" id="footer">
    </footer>

    <script>
        let globalData = {};
        
        async function loadData() {
            const res = await fetch('data.json');
            globalData = await res.json();
            renderKPI(globalData);
            renderChart(globalData);
            renderInsights(globalData);
            renderTable(globalData.campaigns);
            document.getElementById('footer').innerText = `Cập nhật lúc: ${globalData.updated_at} · Dữ liệu từ Meta Ads API`;
        }

        function formatMoney(n) {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(n);
        }

        function renderKPI(data) {
            const sum = data.summary;
            const activeCampaigns = new Set(data.campaigns.map(c => c.campaign_id)).size;
            
            document.getElementById('kpi-cards').innerHTML = `
                <div class="bg-white p-4 rounded shadow border-l-4 border-blue-500">
                    <div class="text-slate-secondary text-sm">Tổng chi phí (all time)</div>
                    <div class="text-2xl font-bold">${formatMoney(sum.total_spend)}</div>
                </div>
                <div class="bg-white p-4 rounded shadow border-l-4 border-green-500">
                    <div class="text-slate-secondary text-sm">Tổng chuyển đổi (Leads)</div>
                    <div class="text-2xl font-bold">${sum.total_conversions}</div>
                </div>
                <div class="bg-white p-4 rounded shadow border-l-4 border-yellow-500">
                    <div class="text-slate-secondary text-sm">CPA trung bình</div>
                    <div class="text-2xl font-bold">${formatMoney(sum.avg_cpa)}</div>
                </div>
                <div class="bg-white p-4 rounded shadow border-l-4 border-purple-500">
                    <div class="text-slate-secondary text-sm">Chiến dịch đang chạy</div>
                    <div class="text-2xl font-bold">${activeCampaigns}</div>
                </div>
            `;
        }

        function renderChart(data) {
            const ctx = document.getElementById('spendChart').getContext('2d');
            const daily = {};
            data.daily_spend.forEach(r => {
                daily[r.date] = (daily[r.date] || 0) + r.spend;
            });
            const dates = Object.keys(daily).sort();
            const spends = dates.map(d => daily[d]);

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dates,
                    datasets: [{
                        label: 'Tổng Spend (VND)',
                        data: spends,
                        borderColor: '#3b82f6',
                        tension: 0.1
                    }]
                }
            });
        }

        function renderInsights(data) {
            const campaigns = [...data.campaigns].sort((a,b) => a.cpa - b.cpa);
            const sum = data.summary;
            
            let insightHtml = `
                <h2 class="text-xl font-bold mb-4">Phân tích Marketing cho Chủ doanh nghiệp</h2>
                <div class="space-y-4">
                    <div class="p-4 bg-blue-50 rounded">
                        <h3 class="font-bold">Bên marketing đang làm gì với tiền của anh?</h3>
                        <ul class="list-disc ml-5 mt-2">
                            <li>Tổng tiền đã chi: <strong>${formatMoney(sum.total_spend)}</strong></li>
                            <li>Đổi lại được: <strong>${sum.total_conversions}</strong> người để lại thông tin</li>
                            <li>Trung bình mỗi lead tốn: <strong>${formatMoney(sum.avg_cpa)}</strong></li>
                            <li>Đánh giá: ${sum.avg_cpa < 50000 ? '<span class="text-green-600 font-bold">TỐT</span>' : sum.avg_cpa < 100000 ? '<span class="text-yellow-600 font-bold">CHẤP NHẬN</span>' : '<span class="text-red-600 font-bold">ĐẮT</span>'}</li>
                        </ul>
                    </div>
                </div>
            `;
            document.getElementById('marketing-insights').innerHTML = insightHtml;
        }

        function renderTable(campaigns) {
            const tbody = document.getElementById('campaign-table');
            tbody.innerHTML = '';
            
            campaigns.forEach(c => {
                let badge = '';
                let bg = 'zebra-row';
                if (c.cpa > 100000) { badge = '<span class="bg-red-500 text-white px-2 py-1 rounded text-xs">ĐỐT TIỀN</span>'; bg += ' bg-red-50'; }
                else if (c.cpa > 0 && c.cpa < 50000) { badge = '<span class="bg-green-500 text-white px-2 py-1 rounded text-xs">HIỆU QUẢ</span>'; }
                else if (c.conversions === 0 && c.spend > 100000) { badge = '<span class="bg-yellow-500 text-white px-2 py-1 rounded text-xs">CẢNH BÁO</span>'; }

                tbody.innerHTML += `
                    <tr class="${bg} border-b">
                        <td class="p-2">${c.campaign_name}</td>
                        <td class="p-2">${c.account_id}</td>
                        <td class="p-2">${formatMoney(c.spend)}</td>
                        <td class="p-2">${c.impressions}</td>
                        <td class="p-2">${c.clicks}</td>
                        <td class="p-2">${(c.ctr*100).toFixed(2)}%</td>
                        <td class="p-2">${c.conversions}</td>
                        <td class="p-2">${formatMoney(c.cpa)}</td>
                        <td class="p-2">${badge}</td>
                    </tr>
                `;
            });
        }
        
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            const filtered = globalData.campaigns.filter(c => c.campaign_name.toLowerCase().includes(val));
            renderTable(filtered);
        });

        loadData();
    </script>
</body>
</html>
